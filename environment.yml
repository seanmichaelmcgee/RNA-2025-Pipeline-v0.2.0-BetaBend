# environment.yml for RNA Folding Project - V1 PyTorch Pipeline
# Defines the core environment for training and inference.
# Feature extraction tools are excluded as features are assumed to be precomputed.

name: rna-3d-folding # Environment name used in Dockerfile

channels:
  - pytorch # Prioritize PyTorch channel for PyTorch itself
  - nvidia # For CUDA toolkit consistency
  - conda-forge # High priority for most other packages
  - defaults

dependencies:
  # --- Core Compute & Python ---
  - python=3.10 # Or 3.11 - good balance of features and compatibility
  - pip # For potential pip installs if needed later
  - numpy # Fundamental package for numerical operations
  - pandas # For data loading config/metadata if needed (e.g., reading sequence lists)
  - scipy # Often used by underlying libraries or for metrics
  - pyyaml # For loading config/default_config.yaml

  # --- PyTorch & Tensor Operations ---
  - pytorch>=2.1
  - pytorch-cuda=12.1 # MUST match the CUDA version in the Docker base image
  - einops # For clean, readable tensor manipulations in transformer architectures

  # --- Machine Learning & Data Science ---
  - scikit-learn # For PCA, dimensionality reduction, and analysis

  # --- Logging & Experiment Tracking ---
  - tensorboard # For logging training progress
  - tqdm # Progress bars
  - wandb # More robust alternative to tensorboard for experiment tracking

  # --- Testing & Development Tools ---
  - pytest # Required for running tests (used in existing test files)
  - black # Code formatting (referenced in CLAUDE.md)
  - isort # Import sorting (referenced in CLAUDE.md)
  - mypy # Type checking (referenced in CLAUDE.md)

  # --- Visualization & Analysis ---
  - jupyter
  - matplotlib
  - seaborn
  - plotly # Interactive visualizations, especially for 3D structures
  - ipywidgets # For interactive notebooks

  # --- File I/O ---
  - h5py # If using HDF5 format later, keep for flexibility

  # --- Pip Dependencies ---
  - pip:
    - py3Dmol # Interactive molecular visualization for notebooks

# --- Final Pinning Recommendation ---
# Before finalizing model training or sharing, it's critical to pin
# exact versions for all packages (pytorch, numpy, pandas, etc.)
# for maximum reproducibility. Example:
#   - python=3.10.13
#   - pytorch=2.1.2=py3.10_cuda12.1_cudnn8_0
#   - numpy=1.26.4
# Use 'conda list --explicit > spec-file.txt' in a working env
# or manually specify versions here.
